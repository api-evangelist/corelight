    RESTful API for remotely configuring and controlling a Corelight Sensor and
    Fleet Manager. Device-local and account-gated (no public OpenAPI); driven by
    the official open-source corelight-client CLI. Authentication is HTTP Basic
    with admin (unlimited) and monitor (read-only) users, plus 2FA when using a
    Fleet Manager.
